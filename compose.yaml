services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: development
      POSTGRES_DB: extensible_ai_workspace
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app -d extensible_ai_workspace
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql

  web:
    build: .
    image: extensible-ai-workspace:local
    environment:
      AIW_RUNTIME_ROLE: web
      AIW_DATABASE_URL: postgresql://app:development@postgres:5432/extensible_ai_workspace
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build: .
    image: extensible-ai-workspace:local
    environment:
      AIW_RUNTIME_ROLE: worker
      AIW_DATABASE_URL: postgresql://app:development@postgres:5432/extensible_ai_workspace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
