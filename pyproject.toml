[project]
name = "extensible-ai-workspace"
version = "0.1.0"
description = "A self-hostable, extensible AI workspace with persistent context, controlled tool use, and source-traceable workflows."
readme = "README.md"
authors = [
    { name = "JA50N14", email = "macfarlane_j@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
extensible-ai-workspace = "extensible_ai_workspace:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]
